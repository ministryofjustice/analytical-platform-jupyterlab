---
name: Scan Container

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  scan-container:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      actions: read
    uses: ministryofjustice/analytical-platform-github-actions/.github/workflows/reusable-container-scan.yml@497b26456c1f0cff118cf5f663b66794d368f3e8 # v8.0.2
    with:
      runtime: python
